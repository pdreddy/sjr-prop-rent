<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#166a4a" />
  <title>Offline · SJR Rent Tracker</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f5f6f5; color: #17201b; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; padding: 24px; box-sizing: border-box; }
    main { max-width: 22rem; text-align: center; }
    img { width: 72px; height: 72px; border-radius: 18px; }
    h1 { font-size: 1.25rem; margin: 1rem 0 .25rem; }
    p { color: #6b7570; margin: 0 0 1.25rem; line-height: 1.5; }
    button { min-height: 44px; padding: 0 1.25rem; border: 0; border-radius: 12px; background: #166a4a; color: #fff; font-size: 1rem; font-weight: 600; }
  </style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="" />
    <h1>You&rsquo;re offline</h1>
    <p>Rent and electricity data is always loaded live, so please reconnect to the internet and try again.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
